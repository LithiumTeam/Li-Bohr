<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Li-Bohr | مدل اتمی بور</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        const savedTheme = localStorage.getItem("li-bohr-theme");
        if (savedTheme === "dark" || savedTheme === "light") document.documentElement.dataset.theme = savedTheme;
    </script>
</head>

<body>
    <header class="site-head">
        <div class="brand">
            <span class="wordmark">Li-Bohr</span>
            <img class="brand-logo" src="images/icon.png" alt="Li-Bohr">
        </div>
        <div class="head-actions">
            <a class="head-github" href="https://github.com/LithiumTeam/Li-Bohr" target="_blank" rel="noopener noreferrer" aria-label="گیت‌هاب Li-Bohr">
                <i class="bi bi-github"></i>
            </a>
            <button type="button" class="theme-switch" id="theme-toggle" role="switch" aria-checked="false"
                aria-label="تغییر تم لایت و دارک">
                <i class="bi bi-sun"></i>
                <span class="switch-track"><span class="switch-knob"></span></span>
                <i class="bi bi-moon-stars"></i>
            </button>
        </div>
    </header>

    <div class="page">
        <p class="tagline">مدل اتمی بور را بر اساس نوترون‌ها، پروتون‌ها و الکترون‌ها بساز و تصویر آن را دریافت کن</p>

        <main class="layout">
            <section class="card">
                <h2 class="card-title">
                    <i class="bi bi-atom"></i>
                    مشخصات اتم
                </h2>
                <form id="atom-form" class="atom-form">
                    <label class="field">
                        <span class="field-label">
                            <span class="particle-dot particle-neutron"></span>
                            نوترون
                        </span>
                        <input type="number" id="neutrons" min="0" step="1" placeholder="تعداد نوترون">
                    </label>
                    <label class="field">
                        <span class="field-label">
                            <span class="particle-dot particle-proton"></span>
                            پروتون
                        </span>
                        <input type="number" id="protons" min="0" step="1" placeholder="تعداد پروتون">
                    </label>
                    <label class="field">
                        <span class="field-label">
                            <span class="particle-dot particle-electron"></span>
                            الکترون
                        </span>
                        <input type="number" id="electrons" min="0" step="1" placeholder="تعداد الکترون">
                    </label>
                    <button type="submit" class="btn btn-primary" id="generate-btn">
                        <i class="bi bi-magic"></i>
                        ساخت اتم
                    </button>
                </form>
            </section>

            <section class="card preview">
                <div class="preview-top">
                    <h2 class="card-title">
                        <i class="bi bi-image"></i>
                        تصویر اتم
                    </h2>
                    <button type="button" class="btn btn-ghost" id="download-btn" disabled>
                        <i class="bi bi-download"></i>
                        دانلود تصویر
                    </button>
                </div>
                <div class="stage">
                    <canvas id="atom-canvas" width="900" height="900"></canvas>
                </div>
                <p class="caption" id="atom-caption">
                    <i class="bi bi-info-circle"></i>
                    <span id="caption-text">تعداد‌ها را وارد کن و روی «ساخت اتم» بزن تا تصویر ساخته شود.</span>
                </p>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
