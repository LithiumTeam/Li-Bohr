<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Li-Bohr | مدل اتمی بور</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page">
        <header class="site-head">
            <img class="logo" src="images/icon.png" alt="Li-Bohr">
            <h1 class="wordmark">Li-Bohr</h1>
            <p class="tagline">مدل اتمی بور را بر اساس نوترون‌ها، پروتون‌ها و الکترون‌ها بساز و تصویر آن را دریافت کن</p>
        </header>

        <main class="layout">
            <section class="card">
                <h2 class="card-title">
                    <i class="bi bi-atom"></i>
                    مشخصات اتم
                </h2>
                <form id="atom-form" class="atom-form">
                    <label class="field">
                        <span class="field-label">
                            <i class="bi bi-circle-slash"></i>
                            نوترون
                        </span>
                        <input type="number" id="neutrons" min="0" step="1" value="4" placeholder="تعداد نوترون">
                    </label>
                    <label class="field">
                        <span class="field-label">
                            <i class="bi bi-record-circle"></i>
                            پروتون
                        </span>
                        <input type="number" id="protons" min="0" step="1" value="3" placeholder="تعداد پروتون">
                    </label>
                    <label class="field">
                        <span class="field-label">
                            <i class="bi bi-dot"></i>
                            الکترون
                        </span>
                        <input type="number" id="electrons" min="0" step="1" value="3" placeholder="تعداد الکترون">
                    </label>
                    <button type="submit" class="btn btn-primary" id="generate-btn">
                        <i class="bi bi-magic"></i>
                        ساخت اتم
                    </button>
                </form>
            </section>

            <section class="card preview">
                <div class="preview-top">
                    <h2 class="card-title">
                        <i class="bi bi-image"></i>
                        تصویر اتم
                    </h2>
                    <button type="button" class="btn btn-ghost" id="download-btn" disabled>
                        <i class="bi bi-download"></i>
                        دانلود تصویر
                    </button>
                </div>
                <div class="stage">
                    <canvas id="atom-canvas" width="900" height="900"></canvas>
                </div>
                <p class="caption" id="atom-caption">
                    <i class="bi bi-info-circle"></i>
                    <span id="caption-text">تعداد‌ها را وارد کن و روی «ساخت اتم» بزن تا تصویر ساخته شود.</span>
                </p>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
